name: Build and Test

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  course-tests:
    name: Jest test discovery
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install course dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Report dependency vulnerabilities
        run: npm audit --audit-level=high
        continue-on-error: true

  browser-gameplay:
    name: Browser gameplay smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install game dependencies
        run: npm install

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run browser gameplay checks
        run: node scripts/browser-smoke.mjs

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-gameplay-screenshots
          path: |
            game/browser-smoke-start.png
            game/browser-smoke-playing.png
          if-no-files-found: ignore

  game-build:
    name: Build Three.js game
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install game dependencies
        run: npm install

      - name: Build game
        run: npm run build
