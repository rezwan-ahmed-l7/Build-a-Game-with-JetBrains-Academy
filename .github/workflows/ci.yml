name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  course-tests:
    name: Jest test discovery
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install course dependencies
        run: npm ci

      # The repository currently has no test/*.js or test/*.jsx files.
      # Keep CI usable while making Jest's "No tests found" output visible.
      - name: Run configured Jest tests (allow empty suite)
        run: npm test -- --passWithNoTests

  game-build:
    name: Build Three.js game
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install game dependencies
        run: npm install

      - name: Build game
        run: npm run build
